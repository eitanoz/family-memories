<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Family Memories Tracker</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --input-bg: #0f172a;
      --accent: #38bdf8;
      --star: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; padding: 20px 16px; min-height: 100vh; }
    .container { width: 100%; max-width: 600px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    .nav-tabs { display: flex; gap: 8px; background: var(--card-bg); padding: 6px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 18px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
    .tab-btn.active { background: var(--primary); color: #fff; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px; }

    .chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { background: #334155; color: #cbd5e1; border: 1px solid transparent; padding: 7px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; cursor: pointer; user-select: none; }
    .chip.active { background: var(--primary); color: #fff; }

    input[type="text"], input[type="date"], select, textarea {
      width: 100%; padding: 11px 13px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: #f8fafc; font-size: 0.95rem; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 80px; resize: vertical; }

    .two-cols { display: flex; gap: 12px; }
    .two-cols > div { flex: 1; }

    .checkbox-row { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; margin-top: 6px; }
    .checkbox-row input { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }

    .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 6px; }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-badge { display: none; margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 0.88rem; text-align: center; }
    .status-success { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; }
    .status-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }

    /* Controls & Records */
    .filter-bar { display: grid; grid-template-columns: 2fr 1fr auto; gap: 8px; margin-bottom: 14px; }
    .fav-filter-btn { background: #334155; border: 1px solid var(--border); color: #cbd5e1; border-radius: 10px; padding: 0 12px; cursor: pointer; font-size: 1.1rem; }
    .fav-filter-btn.active { background: #ca8a04; color: #fff; border-color: #eab308; }

    .record-card { background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; position: relative; }
    .record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding-right: 32px; }
    .record-title { font-weight: 700; color: #fff; font-size: 0.95rem; }
    .record-tag { font-size: 0.75rem; background: var(--border); color: var(--accent); padding: 3px 8px; border-radius: 6px; font-weight: 600; }
    .record-star { position: absolute; top: 12px; right: 14px; font-size: 1.3rem; color: #475569; cursor: pointer; user-select: none; }
    .record-star.starred { color: var(--star); }
    .record-quote { font-style: italic; color: #e2e8f0; margin: 8px 0; font-size: 0.95rem; border-left: 3px solid var(--primary); padding-left: 8px; }
    .record-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
    .btn-edit { background: transparent; border: 1px solid var(--border); color: var(--accent); padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; margin-top: 8px; }
    .btn-edit:hover { background: var(--border); }

    /* Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; padding: 16px; z-index: 100; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 480px; padding: 20px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Family Memories</h1>
      <p>Log, view & cherish family moments</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button type="button" class="tab-btn active" id="tabBtnLog" onclick="switchTab('logTab')">Log Memory</button>
      <button type="button" class="tab-btn" id="tabBtnRecords" onclick="switchTab('recordsTab')">All Records</button>
    </div>

    <div class="card">
      <!-- Tab 1: Form -->
      <div id="logTab" class="tab-content active">
        <form id="memoryForm">
          <div class="form-group">
            <label>Subject</label>
            <div class="chip-group" id="subjectChips">
              <button type="button" class="chip active" onclick="setSubject('Lihi', this)">Lihi</button>
              <button type="button" class="chip" onclick="setSubject('Adam', this)">Adam</button>
              <button type="button" class="chip" onclick="setSubject('Eitan', this)">Eitan</button>
              <button type="button" class="chip" onclick="setSubject('Sima', this)">Sima</button>
              <button type="button" class="chip" onclick="setSubject('Family', this)">Family</button>
              <button type="button" class="chip" onclick="setSubject('Other', this)">Other</button>
            </div>
            <input type="text" id="customSubject" placeholder="Enter name" style="display: none; margin-top: 8px;" />
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Nice Quote">Nice Quote</option>
              <option value="School Achievement">School Achievement</option>
              <option value="Dreams">Dreams</option>
              <option value="Funny Moment">Funny Moment</option>
              <option value="Milestone">Milestone</option>
            </select>
          </div>

          <div class="form-group">
            <label for="details">Details / Quote</label>
            <textarea id="details" placeholder="What happened or what was said?" required></textarea>
          </div>

          <div class="two-cols">
            <div class="form-group">
              <label for="date">Date</label>
              <input type="date" id="date" required />
            </div>
            <div class="form-group">
              <label for="location">Location</label>
              <input type="text" id="location" placeholder="e.g. Home, School" />
            </div>
          </div>

          <div class="form-group">
            <label for="notes">Notes (Optional)</label>
            <input type="text" id="notes" placeholder="Context or reflections" />
          </div>

          <div class="form-group">
            <label class="checkbox-row">
              <input type="checkbox" id="favorite" />
              <span>Mark as Favorite (★)</span>
            </label>
          </div>

          <button type="submit" id="submitBtn" class="btn-submit">Save Memory</button>
        </form>
        <div id="statusBadge" class="status-badge"></div>
      </div>

      <!-- Tab 2: Records List -->
      <div id="recordsTab" class="tab-content">
        <div class="filter-bar">
          <input type="text" id="searchInput" placeholder="Search..." oninput="renderRecords()" />
          <select id="yearFilter" onchange="renderRecords()">
            <option value="ALL">All Years</option>
          </select>
          <button type="button" id="favFilterBtn" class="fav-filter-btn" title="Filter Favorites" onclick="toggleFavFilter()">★</button>
        </div>
        <div id="recordsList">Loading records...</div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Update Memory</h3>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <form id="editForm">
        <input type="hidden" id="editRowIndex" />
        
        <div class="form-group">
          <label for="editSubject">Subject</label>
          <input type="text" id="editSubject" required />
        </div>

        <div class="form-group">
          <label for="editCategory">Category</label>
          <select id="editCategory" required>
            <option value="Nice Quote">Nice Quote</option>
            <option value="School Achievement">School Achievement</option>
            <option value="Dreams">Dreams</option>
            <option value="Funny Moment">Funny Moment</option>
            <option value="Milestone">Milestone</option>
          </select>
        </div>

        <div class="form-group">
          <label for="editDetails">Details / Quote</label>
          <textarea id="editDetails" required></textarea>
        </div>

        <div class="two-cols">
          <div class="form-group">
            <label for="editDate">Date</label>
            <input type="date" id="editDate" required />
          </div>
          <div class="form-group">
            <label for="editLocation">Location</label>
            <input type="text" id="editLocation" />
          </div>
        </div>

        <div class="form-group">
          <label for="editNotes">Notes</label>
          <input type="text" id="editNotes" />
        </div>

        <div class="form-group">
          <label class="checkbox-row">
            <input type="checkbox" id="editFavorite" />
            <span>Mark as Favorite (★)</span>
          </label>
        </div>

        <button type="submit" id="updateBtn" class="btn-submit">Save Changes</button>
      </form>
    </div>
  </div>

  <script>    
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6iV0gyjftQAIEWUzb2VzOBIL6OvsNmk4wwlTHNvuVRYjDv1wI_NPhzw27XQH4wfk/exec";
    let allRecords = [];
    let onlyFavorites = false;

    // Set today's date safely
    try {
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
    } catch (e) {}

    // Tab switcher without blocking UI
    function switchTab(tabId) {
      document.getElementById('tabBtnLog').classList.toggle('active', tabId === 'logTab');
      document.getElementById('tabBtnRecords').classList.toggle('active', tabId === 'recordsTab');
      document.getElementById('logTab').classList.toggle('active', tabId === 'logTab');
      document.getElementById('recordsTab').classList.toggle('active', tabId === 'recordsTab');

      if (tabId === 'recordsTab') {
        fetchRecords();
      }
    }

    let currentSubject = 'Lihi';
    function setSubject(name, btn) {
      document.querySelectorAll('#subjectChips .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      currentSubject = name;
      const customInput = document.getElementById('customSubject');
      if (name === 'Other') {
        customInput.style.display = 'block';
        customInput.focus();
      } else {
        customInput.style.display = 'none';
      }
    }

    function toggleFavFilter() {
      onlyFavorites = !onlyFavorites;
      document.getElementById('favFilterBtn').classList.toggle('active', onlyFavorites);
      renderRecords();
    }

    // Submit New Entry
    document.getElementById('memoryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const badge = document.getElementById('statusBadge');
      btn.disabled = true;
      btn.innerText = 'Saving...';
      badge.style.display = 'none';

      const finalSubject = currentSubject === 'Other'
        ? (document.getElementById('customSubject').value.trim() || 'Other')
        : currentSubject;

      const payload = {
        date: document.getElementById('date').value,
        subject: finalSubject,
        category: document.getElementById('category').value,
        details: document.getElementById('details').value,
        location: document.getElementById('location').value,
        notes: document.getElementById('notes').value,
        favorite: document.getElementById('favorite').checked
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        badge.className = 'status-badge status-success';
        badge.innerText = '✨ Memory saved to Google Sheets!';
        badge.style.display = 'block';
        document.getElementById('details').value = '';
        document.getElementById('notes').value = '';
        document.getElementById('favorite').checked = false;
      } catch (err) {
        badge.className = 'status-badge status-error';
        badge.innerText = '⚠️ Failed to save. Please try again.';
        badge.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Save Memory';
      }
    });

    // Fetch Records via JSONP
    function fetchRecords() {
      const container = document.getElementById('recordsList');
      container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 14px;">Loading records from Google Sheets...</p>';

      const oldScript = document.getElementById('jsonpCallback');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonpCallback';
      script.src = SCRIPT_URL + '?callback=handleDataResponse&t=' + Date.now();
      script.onerror = function() {
        container.innerHTML = '<p style="color: #f87171; text-align: center; padding: 14px;">Could not connect to Google Sheets. Check deployment settings.</p>';
      };
      document.body.appendChild(script);
    }

    // JSONP callback
    window.handleDataResponse = function(json) {
      allRecords = (json && json.records) ? json.records : [];
      populateYearFilter();
      renderRecords();
    };

    function populateYearFilter() {
      const yearSelect = document.getElementById('yearFilter');
      const selectedYear = yearSelect.value;
      const years = new Set();

      allRecords.forEach(r => {
        if (r.date) {
          const y = String(r.date).substring(0, 4);
          if (!isNaN(y) && y.length === 4) years.add(y);
        }
      });

      const sortedYears = Array.from(years).sort().reverse();
      yearSelect.innerHTML = '<option value="ALL">All Years</option>' +
        sortedYears.map(y => `<option value="${y}">${y}</option>`).join('');

      if (sortedYears.includes(selectedYear)) {
        yearSelect.value = selectedYear;
      }
    }

    function renderRecords() {
      const query = (document.getElementById('searchInput').value || '').toLowerCase();
      const selectedYear = document.getElementById('yearFilter').value;
      const container = document.getElementById('recordsList');

      const filtered = allRecords.filter(r => {
        const matchesQuery = (r.subject || '').toLowerCase().includes(query) ||
          (r.details || '').toLowerCase().includes(query) ||
          (r.category || '').toLowerCase().includes(query) ||
          (r.location || '').toLowerCase().includes(query);

        const matchesYear = selectedYear === 'ALL' || (r.date && String(r.date).startsWith(selectedYear));
        const matchesFav = !onlyFavorites || r.favorite === true;

        return matchesQuery && matchesYear && matchesFav;
      });

      if (!filtered.length) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">No matching memories found.</p>';
        return;
      }

      container.innerHTML = filtered.map(r => `
        <div class="record-card">
          <span class="record-star ${r.favorite ? 'starred' : ''}" onclick="toggleStar(${r.rowIndex})">★</span>
          <div class="record-header">
            <div>
              <span class="record-title">${escapeHtml(r.subject)}</span>
              <span class="record-tag">${escapeHtml(r.category)}</span>
            </div>
          </div>
          <div class="record-quote">"${escapeHtml(r.details)}"</div>
          <div class="record-meta">
            <span>📅 ${escapeHtml(r.date)}</span>
            ${r.location ? `<span>📍 ${escapeHtml(r.location)}</span>` : ''}
            ${r.notes ? `<span>📝 ${escapeHtml(r.notes)}</span>` : ''}
          </div>
          <button type="button" class="btn-edit" onclick="openEditModal(${r.rowIndex})">Edit</button>
        </div>
      `).join('');
    }

    async function toggleStar(rowIndex) {
      const record = allRecords.find(r => r.rowIndex === rowIndex);
      if (!record) return;

      record.favorite = !record.favorite;
      renderRecords();

      const payload = {
        action: 'update',
        rowIndex: record.rowIndex,
        subject: record.subject,
        category: record.category,
        details: record.details,
        date: record.date,
        location: record.location,
        notes: record.notes,
        favorite: record.favorite
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error(e);
      }
    }

    function openEditModal(rowIndex) {
      const record = allRecords.find(r => r.rowIndex === rowIndex);
      if (!record) return;

      document.getElementById('editRowIndex').value = record.rowIndex;
      document.getElementById('editSubject').value = record.subject;
      document.getElementById('editCategory').value = record.category;
      document.getElementById('editDetails').value = record.details;
      document.getElementById('editDate').value = record.date;
      document.getElementById('editLocation').value = record.location;
      document.getElementById('editNotes').value = record.notes;
      document.getElementById('editFavorite').checked = record.favorite === true;

      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('updateBtn');
      btn.disabled = true;
      btn.innerText = 'Updating...';

      const payload = {
        action: 'update',
        rowIndex: document.getElementById('editRowIndex').value,
        subject: document.getElementById('editSubject').value,
        category: document.getElementById('editCategory').value,
        details: document.getElementById('editDetails').value,
        date: document.getElementById('editDate').value,
        location: document.getElementById('editLocation').value,
        notes: document.getElementById('editNotes').value,
        favorite: document.getElementById('editFavorite').checked
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        closeEditModal();
        setTimeout(fetchRecords, 800);
      } catch (err) {
        alert('Failed to update record.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Save Changes';
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
